const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height,TS=44,GW=20,GH=14;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

    id=(p,q)=>b[((p%g)+g)%g+(((q%g)+g)%g)*g],A=id(x0,y0),B=id(x0+1,y0),C=id(x0,y0+1),D=id(x0+1,y0+1),

}

{const lg=ctx.createRadialGradient(px,py-TS*0.5,TS*0.3,px,py-TS*0.5,TS*4.5);lg.addColorStop(0,'rgba(255,224,170,0.20)');lg.addColorStop(0.5,'rgba(232,163,61,0.07)');lg.addColorStop(1,'rgba(232,163,61,0)');ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=lg;ctx.beginPath();ctx.arc(px,py-TS*0.5,TS*4.5,0,7);ctx.fill();ctx.restore();}
