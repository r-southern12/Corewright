<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#05070f}</style></head>
<body><canvas id="c" width="760" height="470"></canvas>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=cv.width,H=cv.height;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const CS=170,GAP=10,X0=25;
// tier-tinted chunky rock: T1 brown-ish shallow, T2 grey stone, T3 dark hard rock
function rock(x,y,s,tier){const base={1:[34,28,20],2:[18,22,30],3:[12,12,22]}[tier];ctx.fillStyle=`rgb(${base[0]},${base[1]},${base[2]})`;ctx.fillRect(x,y,s,s);
  const rr=mul(x*131+y*17+tier);const peb={1:[60,50,38],2:[46,52,66],3:[40,42,64]}[tier];
  for(let i=0;i<110;i++){const cx=x+rr()*s,cy=y+rr()*s,r=3+rr()*6,sh=0.6+rr()*0.5;ctx.fillStyle=`rgb(${peb[0]*sh|0},${peb[1]*sh|0},${peb[2]*sh|0})`;
    ctx.beginPath();for(let a=0;a<5;a++){const an=a/5*6.28+rr(),rad=r*(0.7+rr()*0.5);ctx[a?'lineTo':'moveTo'](cx+Math.cos(an)*rad,cy+Math.sin(an)*rad);}ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(160,175,205,0.16)';ctx.beginPath();ctx.arc(cx-r*0.25,cy-r*0.3,r*0.4,Math.PI*1.1,Math.PI*1.9);ctx.fill();}}
function xtal(cx,cy,r,rot,Hc){const[WHT,BRT,MID,DK]=Hc;
  const lp=[[0,-1.0],[0.58,-0.45],[0.62,0.4],[0,1.0],[-0.62,0.4],[-0.58,-0.45]];
  const P=lp.map(([lx,ly])=>{const rx=lx*r*0.9,ry=ly*r;return[cx+Math.cos(rot)*rx-Math.sin(rot)*ry,cy+Math.sin(rot)*rx+Math.cos(rot)*ry];});
  ctx.fillStyle=BRT;ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(P[5][0],P[5][1]);ctx.lineTo(P[4][0],P[4][1]);ctx.lineTo(P[3][0],P[3][1]);ctx.closePath();ctx.fill();
  ctx.fillStyle=DK;ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(P[1][0],P[1][1]);ctx.lineTo(P[2][0],P[2][1]);ctx.lineTo(P[3][0],P[3][1]);ctx.closePath();ctx.fill();
  ctx.fillStyle=WHT;ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(P[5][0],P[5][1]);ctx.lineTo(P[1][0],P[1][1]);ctx.closePath();ctx.fill();
  ctx.fillStyle=MID;ctx.globalAlpha=0.5;ctx.beginPath();ctx.moveTo(P[4][0],P[4][1]);ctx.lineTo(P[3][0],P[3][1]);ctx.lineTo(P[2][0],P[2][1]);ctx.closePath();ctx.fill();ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,0.55)';ctx.lineWidth=Math.max(1,r*0.05);ctx.beginPath();ctx.moveTo(P[0][0],P[0][1]);ctx.lineTo(P[3][0],P[3][1]);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.beginPath();P.forEach((p,i)=>ctx[i?'lineTo':'moveTo'](p[0],p[1]));ctx.closePath();ctx.stroke();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(P[0][0],P[0][1],r*0.09,0,7);ctx.fill();}
// core: tier sets size/density/brilliance/glow; seed sets the arrangement (variation)
function core(cx,cy,Hc,RGB,tier,seed){const rng=mul((seed*2654435761)>>>0);
  const cfg={1:{main:24,n:1,glow:0.34},2:{main:40,n:3,glow:0.48},3:{main:54,n:6,glow:0.62}}[tier];
  const gl=ctx.createRadialGradient(cx,cy,3,cx,cy,cfg.main*1.9);gl.addColorStop(0,`rgba(${RGB},${cfg.glow})`);gl.addColorStop(1,`rgba(${RGB},0)`);
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,cfg.main*1.9,0,7);ctx.fill();ctx.restore();
  const shards=[];for(let i=0;i<cfg.n;i++){const an=rng()*6.28,d=cfg.main*(0.6+rng()*0.7),sz=cfg.main*(0.28+rng()*0.34),ro=(rng()-0.5)*1.6;shards.push([cx+Math.cos(an)*d,cy+Math.sin(an)*d,sz,ro]);}
  shards.sort((a,b)=>a[1]-b[1]);for(const s of shards)if(s[1]<cy)xtal(s[0],s[1],s[2],s[3],Hc);
  xtal(cx,cy,cfg.main,(rng()-0.5)*0.5,Hc);
  for(const s of shards)if(s[1]>=cy)xtal(s[0],s[1],s[2],s[3],Hc);
  if(tier>=3){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(255,255,255,0.6)';for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(cx+(rng()-0.5)*cfg.main,cy+(rng()-0.5)*cfg.main,2,0,7);ctx.fill();}ctx.restore();}
  const nf=tier*2;for(let i=0;i<nf;i++){const an=rng()*6.28,d=cfg.main*1.6+rng()*20,ox=cx+Math.cos(an)*d,oy=cy+Math.sin(an)*d;ctx.fillStyle='#E8A33D';ctx.beginPath();ctx.arc(ox,oy,3,0,7);ctx.fill();ctx.fillStyle='rgba(255,240,200,0.8)';ctx.beginPath();ctx.arc(ox-1,oy-1,1.2,0,7);ctx.fill();}}
ctx.fillStyle='#0a0d16';ctx.fillRect(0,0,W,H);
const TEAL=['#eafffb','#6fe9d0','#2fbfa2','#166b5a'],T_RGB='79,227,193';
ctx.font='14px Georgia';ctx.textAlign='center';ctx.fillStyle='rgba(235,240,250,0.95)';
// row 1: tier progression
['Tier I','Tier II','Tier III'].forEach((n,i)=>{const x=X0+i*(CS+GAP),y=40;rock(x,y,CS,i+1);ctx.save();ctx.beginPath();ctx.rect(x,y,CS,CS);ctx.clip();core(x+CS/2,y+CS/2,TEAL,T_RGB,i+1,7+i);ctx.restore();ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.strokeRect(x,y,CS,CS);ctx.fillStyle='rgba(235,240,250,0.95)';ctx.fillText(n,x+CS/2,30);});
ctx.fillText('TIER — size · density · brilliance · host rock',X0+1.5*(CS+GAP),40+CS+26);
// row 2: variation (same tier II, different seeds)
for(let i=0;i<4;i++){const x=X0+i*(CS+GAP),y=40+CS+46;rock(x,y,CS,2);ctx.save();ctx.beginPath();ctx.rect(x,y,CS,CS);ctx.clip();core(x+CS/2,y+CS/2,TEAL,T_RGB,2,31+i*13);ctx.restore();ctx.strokeStyle='rgba(0,0,0,0.5)';ctx.strokeRect(x,y,CS,CS);}
ctx.fillStyle='rgba(235,240,250,0.85)';ctx.fillText('VARIATION — four Tier-II cores, same hue, seeded arrangements',X0+2*(CS+GAP)-CS/2,y2());function y2(){return H-10;}
ctx.textAlign='start';window.__done=true;
</script></body></html>
